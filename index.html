<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Merey ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }
        .btn:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .heart {
            position: fixed;
            bottom: -30px;
            color: #ff4d6d;
            font-size: 20px;
            animation: floatUp 3s linear forwards;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>For Merey ✨</h1>
        <p>
            I was just thinking about you and wanted to say...
            I miss you so much, especially your beautiful eyes.
            You mean the world to me. ❤️
        </p>
        <button class="btn" onclick="createHearts()">
            Click here ❤️
        </button>
    </div>
    <script>
        function createHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");
                    heart.classList.add("heart");
                    heart.innerHTML = "❤️";
                    heart.style.left = Math.random() * 100 + "vw";
                    heart.style.fontSize =
                        (Math.random() * 20 + 15) + "px";
                    heart.style.animationDuration =
                        (Math.random() * 2 + 2) + "s";
                    document.body.appendChild(heart);
                    setTimeout(() => {
                        heart.remove();
                    }, 4500);
                }, i * 120);
            }
        }
    </script>
</body>
</html>
